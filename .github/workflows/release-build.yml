name: Release Build

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Semantic version, for example 1.0.0
        required: true
        default: 1.0.0
      build_number:
        description: Monotonic store build number
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  android-aab:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Validate release secrets
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY SENTRY_DSN ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done

      - name: Configure Android signing
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/bearfetch-upload.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/bearfetch-upload.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - name: Build signed production AAB
        run: >-
          flutter build appbundle
          --release
          --flavor production
          --build-name=${{ inputs.build_name }}
          --build-number=${{ inputs.build_number }}
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=SENTRY_ENVIRONMENT=production

      - uses: actions/upload-artifact@v4
        with:
          name: bearfetch-production-aab
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error

  ios-ipa:
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Validate release secrets
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY SENTRY_DSN APPLE_TEAM_ID IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME KEYCHAIN_PASSWORD; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done

      - name: Install Apple signing material
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/BearFetch.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/bearfetch-signing.keychain-db"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | openssl base64 -d -A > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | openssl base64 -d -A > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/BearFetch.mobileprovision"
          {
            printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID"
            printf 'CODE_SIGN_STYLE = Manual\n'
            printf 'CODE_SIGN_IDENTITY = Apple Distribution\n'
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$IOS_PROVISIONING_PROFILE_NAME"
          } > ios/Flutter/Signing.local.xcconfig

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.bearfetch.app</key><string>$IOS_PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF

      - run: flutter pub get
      - name: Build signed production IPA
        run: >-
          flutter build ipa
          --release
          --flavor production
          --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          --build-name=${{ inputs.build_name }}
          --build-number=${{ inputs.build_number }}
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=SENTRY_ENVIRONMENT=production

      - uses: actions/upload-artifact@v4
        with:
          name: bearfetch-production-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
