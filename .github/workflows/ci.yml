name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-android:
    # This private repository uses the owner's macOS ARM64 runner. Never add a
    # pull_request trigger here: self-hosted runners must not execute fork code.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/local/app_database.g.dart

      - name: Build development APK
        run: >-
          flutter build apk
          --debug
          --flavor development
          --dart-define=APP_ENV=development

      - uses: actions/upload-artifact@v4
        with:
          name: bearfetch-development-apk
          path: build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error

  secret-scan:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
